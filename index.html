<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="style.css" rel="stylesheet">
    <link href="modern-normalize.css" rel="stylesheet">
</head>

<body>
    <div class="image-and-logo-container"></div>
    <div class="container">
        <div class="form-container">
            <div class="text margin-l">
                <h1>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.</h1>
                <h1>You <em>know</em> you want to.</h1>
            </div>
            <form>
                <fieldset class="margin-l">
                    <h2>Let's do this!</h2>

                    <label for="first-name">
                        <span>FIRST NAME</span>
                        <input id="first-name" name="user-first-name" type="text">
                    </label>

                    <label for="last-name">
                        <span>LAST NAME</span>
                        <input id="last-name" name="user-last-name" type="text">
                    </label>

                    <label for="email">
                        <span>EMAIL</span>
                        <input id="email" name="user-email" type="email">
                    </label>

                    <label for="phone-number">
                        <span>PHONE NUMBER</span>
                        <input id="phone-number" name="user-phone-number" type="tel">
                    </label>

                    <label for="password">
                        <span>PASSWORD</span>
                        <input id="password" name="user-password" type="password">
                    </label>

                    <label for="confirm-password">
                        <span>CONFIRM PASSWORD</span>
                        <input id="confirm-password" type="password">
                    </label>
                </fieldset>

            </form>
        </div>
    </div>
</body>

</html>
