<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="style.css" rel="stylesheet">
    <link href="modern-normalize.css" rel="stylesheet">
</head>

<body>
    <div class="image-and-logo-container">
        <div class="logo-container">
            <img src="images/odin-lined.png">
            <h1>ODIN</h1>
        </div>

        <div class="copyright">
            <span>Photo by <a href="https://unsplash.com/@kalaniparker" target="_blank">Kellen Riggin </a>on <a
                    href="https://unsplash.com/" target="_blank">Unsplash</a></span>
        </div>
    </div>
    <div class="container">
        <div class="form-container">
            <div class="text margin-l">
                <h1>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.</h1>
                <h1>You <em>know</em> you want to.</h1>
            </div>
            <form>
                <fieldset>
                    <h2 class="margin-l">Let's do this!</h2>
                        <div class="flex">
                        <div>
                        <label for="first-name" class="margin-l">
                            <span>FIRST NAME</span>
                            </label>
                            <input  required id="first-name" name="user-first-name" type="text" class="margin-l">
                        </div>
                    
                        <div>
                        <label for="last-name" class="margin-l">
                            <span>LAST NAME</span>
                            </label>
                            <input  required id="last-name" name="user-last-name" type="text" class="margin-l">
                        </div>
                        </div>
                    <div class="flex">
                        <div>
                        <label for="email" class="margin-l">
                            <span>EMAIL</span>
                            </label>
                            <input  required id="email" name="user-email" type="email" class="margin-l">
                        </div>

                        <div>
                        <label for="phone-number" class="margin-l">
                            <span>PHONE NUMBER</span>
                            </label>
                            <input  required id="phone-number" name="user-phone-number" placeholder="e.g. 0533-333-333" type="tel" pattern="[0-9]{4} [0-9]{3} [0-9]{3}" class="margin-l">
                        </div>
                    </div>
<div class="flex">
                    <div>
                        <label for="password" class="margin-l">
                            <span>PASSWORD</span>
                            </label>
                            <input  required id="password" name="user-password" type="password" class="margin-l">
                        </div>
                        <div>
                        <label for="confirm-password" class="margin-l"> 
                            <span>CONFIRM PASSWORD</span>
                            </label>
                            <input required id="confirm-password" type="password" name="user-password-confirmation" class="margin-l">
                        </div>
                  </div>  
                </fieldset>

                <div class="submit-container margin-l">
                    <button type="submit" class="submit-btn">Create Account</button>
                    <span>Already have an account? <a href="#">Log in</a></span>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
